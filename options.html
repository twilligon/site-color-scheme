<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>Site Color Scheme</title>
    <style>
      body, #overrides, #overrides > div, #add {
        display: flex;
        gap: 0.5em;
      }

      body, #overrides {
        flex-direction: column;
      }

      #overrides span, #pattern {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="overrides"></div>
    <form id="add">
      <input id="pattern" placeholder="*.example.com" required>
      <select id="value">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
      <button>+</button>
    </form>
    <script src="options.js"></script>
  </body>
</html>
